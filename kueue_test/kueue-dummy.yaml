apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: dummy-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: dummy-clusterqueue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: "dummy-flavor"
          resources:
            - name: "cpu"
              nominalQuota: 100
            - name: "memory"
              nominalQuota: 40Gi
---            
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: dummy-localqueue
  namespace: ja-ope-test
spec:
  clusterQueue: dummy-clusterqueue